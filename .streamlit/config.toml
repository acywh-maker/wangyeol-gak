# 자동 생성 파일 — scripts/build_tokens.py 가 tokens.json으로 만든다. 직접 고치지 말 것.

[theme]
base = "light"
primaryColor = "#FF884D"
backgroundColor = "#EFEEEC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#333333"
linkColor = "#333333"
linkUnderline = false
borderColor = "#ECECEC"
dataframeBorderColor = "#ECECEC"
dataframeHeaderBackgroundColor = "#FBFBFB"
showWidgetBorder = true
font = "'Pretendard Variable':https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
headingFont = "'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', sans-serif"
baseFontSize = 16
headingFontSizes = ["44px", "24px", "22px", "20px", "19px", "16px"]
headingFontWeights = [700, 700, 700, 700, 600, 600]
baseRadius = "8px"
buttonRadius = "12px"

[theme.sidebar]
backgroundColor = "#FBFBFB"

[client]
toolbarMode = "viewer"

[server]

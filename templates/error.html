{% extends "base.html" %}
{% block content %}
<div class="section" style="padding-top: var(--space-11)">
  <h1 class="t-title">노트를 불러오지 못했어요</h1>
  <p class="t-body">잠시 후 다시 시도해 주세요.</p>
  {% if detail %}<p class="t-meta">개발용 상세: {{ detail }}</p>{% endif %}
  <a class="btn btn--primary btn--block" href="{{ request.full_path.rstrip('?') }}">다시 시도</a>
</div>
{% endblock %}
